<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古诗朗读评测 · 一年三班</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --line:#e5e9f0; --text:#2c3e50; --muted:#7a8699;
  --primary:#3b7cff; --primary-dark:#2b62d8; --green:#22c55e; --red:#ef4444;
  --yellow:#f59e0b; --radius:12px; --shadow:0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--text);}
button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;padding:9px 16px;font-size:14px;transition:.15s}
button:active{transform:translateY(1px)}
.btn{background:var(--primary);color:#fff}
.btn:hover{background:var(--primary-dark)}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn.danger{background:#fff;color:var(--red);border:1px solid #fecaca}
.btn.green{background:var(--green);color:#fff}
.btn.sm{padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* 顶部导航 */
nav{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 20px;height:56px;box-shadow:var(--shadow)}
nav .logo{font-weight:700;font-size:16px;margin-right:20px;white-space:nowrap}
nav a{padding:8px 14px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px}
nav a.active{background:#eef4ff;color:var(--primary);font-weight:600}
nav a:hover{color:var(--primary)}

main{max-width:1200px;margin:20px auto;padding:0 20px 60px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.card h2{font-size:17px;margin:0 0 14px}
.card h3{font-size:15px;margin:0 0 10px;color:var(--text)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:18px;margin-bottom:26px}
.grid > .card{margin-bottom:0}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:820px){.g-4{grid-template-columns:repeat(2,1fr)}.g-2{grid-template-columns:1fr}}

.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.stat .num{font-size:30px;font-weight:700;line-height:1.1}
.stat .lbl{color:var(--muted);font-size:13px;margin-top:4px}
.stat .num.g{color:var(--green)} .stat .num.r{color:var(--red)} .stat .num.b{color:var(--primary)}

input[type=text],select{font-family:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--text)}
input[type=text]:focus,select:focus{outline:none;border-color:var(--primary)}
input[type=text]{min-width:220px}
.combobox{position:relative;display:inline-block;min-width:200px}
.combobox .cb-input{min-width:200px;width:100%}
.cb-drop{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:260px;overflow:auto;z-index:60}
.cb-item{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;cursor:pointer;font-size:14px}
.cb-item:hover,.cb-item.hover{background:#f1f5ff}
.cb-item .cb-label{color:var(--text)}
.cb-item .cb-sub{color:var(--muted);font-size:12px}
.cb-empty{padding:10px 14px;color:var(--muted);font-size:13px}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:13px}
tr:hover td{background:#f8fafc}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;background:#eef4ff;color:var(--primary)}
.tag.g{background:#ecfdf5;color:var(--green)}
.tag.r{background:#fef2f2;color:var(--red)}
.tag.y{background:#fffbeb;color:var(--yellow)}
.muted{color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.link{color:var(--primary);cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}
.bar{height:8px;border-radius:4px;background:#eef1f6;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:4px}

/* 读诗页 */
.poem-title{text-align:center;margin:4px 0 2px;font-size:24px}
.poem-author{text-align:center;color:var(--muted);margin-bottom:16px}
.poem-lines{font-size:22px;line-height:2.1;text-align:center;max-width:640px;margin:0 auto}
.poem-lines .pl{display:inline-block;padding:0 6px}
.char{display:inline-block;padding:0 1px;border-radius:4px;cursor:pointer;min-width:1.1em;text-align:center}
.char.ok{color:var(--green)}
.char.bad{color:#fff;background:var(--red)}
.char.miss{color:#fff;background:#94a3b8;text-decoration:line-through}
.line-res{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed #eef1f6;font-size:17px}
.line-res .acc{font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.mode-switch{display:inline-flex;background:#eef1f6;border-radius:10px;padding:3px}
.mode-switch button{padding:7px 18px;border-radius:8px;background:transparent;color:var(--muted);font-size:14px}
.mode-switch button.on{background:#fff;color:var(--primary);font-weight:700;box-shadow:var(--shadow)}
.live-box{min-height:52px;background:#f8fafc;border:1px dashed var(--line);border-radius:8px;padding:12px;font-size:17px;line-height:1.6;color:#475569}
.rec-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);animation:blink 1s infinite;margin-right:8px;vertical-align:middle}
@keyframes blink{50%{opacity:.25}}
.legend{font-size:12px;color:var(--muted)}
.legend .ok{color:var(--green)} .legend .bad{color:var(--red)} .legend .miss{color:#64748b}
.hint{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.flex-1{flex:1}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:100}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:22px;width:340px;max-width:92vw}
.modal h3{margin:0 0 14px}
.modal .row{margin-top:14px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200}
#toast.show{opacity:1}
</style>
</head>

<script>
/* =========================================================
   数据层：IndexedDB
========================================================= */
const DB_NAME='gushi_reading_v1';
let db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('students')) d.createObjectStore('students',{keyPath:'id'});
      if(!d.objectStoreNames.contains('poems')) d.createObjectStore('poems',{keyPath:'id'});
      if(!d.objectStoreNames.contains('records')) d.createObjectStore('records',{keyPath:'id'});
      if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta',{keyPath:'k'});
    };
    r.onsuccess=e=>{db=e.target.result;res(db)};
    r.onerror=e=>rej(e);
  });
}
function tx(store,mode){return db.transaction(store,mode).objectStore(store)}
function idbGet(store,key){return new Promise((res,rej)=>{const q=tx(store,'readonly').get(key);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function idbGetAll(store){return new Promise((res,rej)=>{const q=tx(store,'readonly').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function idbPut(store,val){return new Promise((res,rej)=>{const q=tx(store,'readwrite').put(val);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
function idbDelete(store,key){return new Promise((res,rej)=>{const q=tx(store,'readwrite').delete(key);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* =========================================================
   种子数据
========================================================= */
const STUDENTS=['焦紫阳','李靖禾','于晔潼','李晋涵','温紫嫣','王妙伊','吕彦希','历欣雅','陈睿萱','杜星卓','尤麒骏','张书恒','王梓豫','张屹宸','李欣然','刘之远','韩瑾琰','韩瑾瑜','赵峻安','樊雅萱','李子诚','贺书涵','申诺熙','耿智','周佳琪','郑诗洁','王君遥','冯钰涵','崔筱烽','刘翼鸣','张怀瑾','李赫','曾凡恩','邹嘉莹','郑鑫儿','汤文硕','容信桐','赵梓轶','王淇奥','孙睿','曲馨竹','王艺潼'];
const CLASS_NAME='一年三班';

// 诗：t标题 a作者 d朝代 g年级 c内容
const POEMS=[
{t:'咏鹅',a:'骆宾王',d:'唐',g:'一年级',c:'鹅鹅鹅，曲项向天歌。白毛浮绿水，红掌拨清波。'},
{t:'江南',a:'汉乐府',d:'汉',g:'一年级',c:'江南可采莲，莲叶何田田。鱼戏莲叶间。鱼戏莲叶东，鱼戏莲叶西，鱼戏莲叶南，鱼戏莲叶北。'},
{t:'悯农·其二',a:'李绅',d:'唐',g:'一年级',c:'锄禾日当午，汗滴禾下土。谁知盘中餐，粒粒皆辛苦。'},
{t:'古朗月行',a:'李白',d:'唐',g:'一年级',c:'小时不识月，呼作白玉盘。又疑瑶台镜，飞在青云端。'},
{t:'风',a:'李峤',d:'唐',g:'一年级',c:'解落三秋叶，能开二月花。过江千尺浪，入竹万竿斜。'},
{t:'静夜思',a:'李白',d:'唐',g:'一年级',c:'床前明月光，疑是地上霜。举头望明月，低头思故乡。'},
{t:'春晓',a:'孟浩然',d:'唐',g:'一年级',c:'春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。'},
{t:'赠汪伦',a:'李白',d:'唐',g:'一年级',c:'李白乘舟将欲行，忽闻岸上踏歌声。桃花潭水深千尺，不及汪伦送我情。'},
{t:'寻隐者不遇',a:'贾岛',d:'唐',g:'一年级',c:'松下问童子，言师采药去。只在此山中，云深不知处。'},
{t:'池上',a:'白居易',d:'唐',g:'一年级',c:'小娃撑小艇，偷采白莲回。不解藏踪迹，浮萍一道开。'},
{t:'小池',a:'杨万里',d:'宋',g:'一年级',c:'泉眼无声惜细流，树阴照水爱晴柔。小荷才露尖尖角，早有蜻蜓立上头。'},
{t:'画鸡',a:'唐寅',d:'明',g:'一年级',c:'头上红冠不用裁，满身雪白走将来。平生不敢轻言语，一叫千门万户开。'},
{t:'画',a:'王维',d:'唐',g:'一年级',c:'远看山有色，近听水无声。春去花还在，人来鸟不惊。'},
{t:'登鹳雀楼',a:'王之涣',d:'唐',g:'二年级',c:'白日依山尽，黄河入海流。欲穷千里目，更上一层楼。'},
{t:'望庐山瀑布',a:'李白',d:'唐',g:'二年级',c:'日照香炉生紫烟，遥看瀑布挂前川。飞流直下三千尺，疑是银河落九天。'},
{t:'夜宿山寺',a:'李白',d:'唐',g:'二年级',c:'危楼高百尺，手可摘星辰。不敢高声语，恐惊天上人。'},
{t:'敕勒歌',a:'北朝民歌',d:'北朝',g:'二年级',c:'敕勒川，阴山下。天似穹庐，笼盖四野。天苍苍，野茫茫，风吹草低见牛羊。'},
{t:'村居',a:'高鼎',d:'清',g:'二年级',c:'草长莺飞二月天，拂堤杨柳醉春烟。儿童散学归来早，忙趁东风放纸鸢。'},
{t:'咏柳',a:'贺知章',d:'唐',g:'二年级',c:'碧玉妆成一树高，万条垂下绿丝绦。不知细叶谁裁出，二月春风似剪刀。'},
{t:'晓出净慈寺送林子方',a:'杨万里',d:'宋',g:'二年级',c:'毕竟西湖六月中，风光不与四时同。接天莲叶无穷碧，映日荷花别样红。'},
{t:'绝句',a:'杜甫',d:'唐',g:'二年级',c:'两个黄鹂鸣翠柳，一行白鹭上青天。窗含西岭千秋雪，门泊东吴万里船。'},
{t:'悯农·其一',a:'李绅',d:'唐',g:'二年级',c:'春种一粒粟，秋收万颗子。四海无闲田，农夫犹饿死。'},
{t:'舟夜书所见',a:'查慎行',d:'清',g:'二年级',c:'月黑见渔灯，孤光一点萤。微微风簇浪，散作满河星。'},
{t:'梅花',a:'王安石',d:'宋',g:'二年级',c:'墙角数枝梅，凌寒独自开。遥知不是雪，为有暗香来。'},
{t:'小儿垂钓',a:'胡令能',d:'唐',g:'二年级',c:'蓬头稚子学垂纶，侧坐莓苔草映身。路人借问遥招手，怕得鱼惊不应人。'},
{t:'江雪',a:'柳宗元',d:'唐',g:'二年级',c:'千山鸟飞绝，万径人踪灭。孤舟蓑笠翁，独钓寒江雪。'},
{t:'望天门山',a:'李白',d:'唐',g:'二年级',c:'天门中断楚江开，碧水东流至此回。两岸青山相对出，孤帆一片日边来。'},
{t:'早发白帝城',a:'李白',d:'唐',g:'二年级',c:'朝辞白帝彩云间，千里江陵一日还。两岸猿声啼不住，轻舟已过万重山。'},
{t:'采莲曲',a:'王昌龄',d:'唐',g:'二年级',c:'荷叶罗裙一色裁，芙蓉向脸两边开。乱入池中看不见，闻歌始觉有人来。'},
{t:'山行',a:'杜牧',d:'唐',g:'三年级',c:'远上寒山石径斜，白云生处有人家。停车坐爱枫林晚，霜叶红于二月花。'},
{t:'赠刘景文',a:'苏轼',d:'宋',g:'三年级',c:'荷尽已无擎雨盖，菊残犹有傲霜枝。一年好景君须记，最是橙黄橘绿时。'},
{t:'夜书所见',a:'叶绍翁',d:'宋',g:'三年级',c:'萧萧梧叶送寒声，江上秋风动客情。知有儿童挑促织，夜深篱落一灯明。'},
{t:'望洞庭',a:'刘禹锡',d:'唐',g:'三年级',c:'湖光秋月两相和，潭面无风镜未磨。遥望洞庭山水翠，白银盘里一青螺。'},
{t:'饮湖上初晴后雨',a:'苏轼',d:'宋',g:'三年级',c:'水光潋滟晴方好，山色空蒙雨亦奇。欲把西湖比西子，淡妆浓抹总相宜。'},
{t:'绝句·迟日江山丽',a:'杜甫',d:'唐',g:'三年级',c:'迟日江山丽，春风花草香。泥融飞燕子，沙暖睡鸳鸯。'},
{t:'惠崇春江晚景',a:'苏轼',d:'宋',g:'三年级',c:'竹外桃花三两枝，春江水暖鸭先知。蒌蒿满地芦芽短，正是河豚欲上时。'},
{t:'三衢道中',a:'曾几',d:'宋',g:'三年级',c:'梅子黄时日日晴，小溪泛尽却山行。绿阴不减来时路，添得黄鹂四五声。'},
{t:'忆江南',a:'白居易',d:'唐',g:'三年级',c:'江南好，风景旧曾谙。日出江花红胜火，春来江水绿如蓝。能不忆江南？'},
{t:'元日',a:'王安石',d:'宋',g:'三年级',c:'爆竹声中一岁除，春风送暖入屠苏。千门万户曈曈日，总把新桃换旧符。'},
{t:'清明',a:'杜牧',d:'唐',g:'三年级',c:'清明时节雨纷纷，路上行人欲断魂。借问酒家何处有，牧童遥指杏花村。'},
{t:'九月九日忆山东兄弟',a:'王维',d:'唐',g:'三年级',c:'独在异乡为异客，每逢佳节倍思亲。遥知兄弟登高处，遍插茱萸少一人。'},
{t:'滁州西涧',a:'韦应物',d:'唐',g:'三年级',c:'独怜幽草涧边生，上有黄鹂深树鸣。春潮带雨晚来急，野渡无人舟自横。'},
{t:'大林寺桃花',a:'白居易',d:'唐',g:'三年级',c:'人间四月芳菲尽，山寺桃花始盛开。长恨春归无觅处，不知转入此中来。'},
{t:'暮江吟',a:'白居易',d:'唐',g:'四年级',c:'一道残阳铺水中，半江瑟瑟半江红。可怜九月初三夜，露似真珠月似弓。'},
{t:'题西林壁',a:'苏轼',d:'宋',g:'四年级',c:'横看成岭侧成峰，远近高低各不同。不识庐山真面目，只缘身在此山中。'},
{t:'雪梅',a:'卢钺',d:'宋',g:'四年级',c:'梅雪争春未肯降，骚人阁笔费评章。梅须逊雪三分白，雪却输梅一段香。'},

// 诗句拆分：按标点切成「句」
function splitLines(content){
  return content.split(/[，。？！；、\s]+/).filter(s=>s && s.trim());
}

const view=document.getElementById('view');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
function pct(x){return Math.round((x||0)*100)}
function colorFor(acc){
  if(acc==null) return '#94a3b8';
  if(acc>=0.85) return '#22c55e';
  if(acc>=0.6) return '#f59e0b';
  return '#ef4444';
}

/* 可搜索下拉（combobox） */
function combobox(id, value, label, placeholder, items){
  return `<div class="combobox" id="${id}">
    <input type="text" class="cb-input" placeholder="${esc(placeholder)}" autocomplete="off" value="${esc(label)}">
    <input type="hidden" class="cb-value" value="${esc(value)}">
    <div class="cb-drop" style="display:none"></div>
  </div>`;
}
function wireCombobox(id, items, onSelect){
  const box=document.getElementById(id);
  if(!box) return;
  const input=box.querySelector('.cb-input');
  const hidden=box.querySelector('.cb-value');
  const drop=box.querySelector('.cb-drop');
  function render(q){
    q=(q||'').trim();
    let list=items;
    if(q) list=items.filter(it=>it.label.includes(q)||(it.sub||'').includes(q));
    list=list.slice().sort((a,b)=>(a.label.startsWith(q)?0:1)-(b.label.startsWith(q)?0:1));
    drop.innerHTML=list.length
      ? list.map(it=>`<div class="cb-item" data-v="${esc(it.value)}"><span class="cb-label">${esc(it.label)}</span><span class="cb-sub">${esc(it.sub||'')}</span></div>`).join('')
      : '<div class="cb-empty">无匹配结果</div>';
    drop.querySelectorAll('.cb-item').forEach(el=>{
      el.onmousedown=e=>{
        e.preventDefault();
        hidden.value=el.dataset.v;
        input.value=el.querySelector('.cb-label').textContent;
        drop.style.display='none';
        if(onSelect) onSelect(el.dataset.v);
      };
    });
    drop.style.display='block';
  }
  input.addEventListener('input',()=>render(input.value));
  input.addEventListener('focus',()=>render(input.value));
  input.addEventListener('keydown',e=>{
    const items=drop.querySelectorAll('.cb-item');
    if(!items.length) return;
    let idx=-1; items.forEach((el,i)=>{if(el.classList.contains('hover'))idx=i});
    if(e.key==='ArrowDown'){e.preventDefault();idx=(idx+1)%items.length;}
    else if(e.key==='ArrowUp'){e.preventDefault();idx=(idx-1+items.length)%items.length;}
    else if(e.key==='Enter'){e.preventDefault();if(idx>=0)items[idx].dispatchEvent(new MouseEvent('mousedown',{bubbles:true}));return;}
    else return;
    items.forEach((el,i)=>el.classList.toggle('hover',i===idx));
    items[idx].scrollIntoView({block:'nearest'});
  });
  document.addEventListener('mousedown',e=>{if(!box.contains(e.target))drop.style.display='none'});
}

/* 统计：学生平均正确率、易错句等 */
function studentStats(records, students){
  const map={};
  for(const s of students){map[s.id]={id:s.id,name:s.name,count:0,sum:0,acc:null}}
  for(const r of records){
    const st=map[r.studentId]; if(!st) continue;
    if(r.overallAccuracy==null) continue;
    st.count++; st.sum+=r.overallAccuracy;
  }
  for(const k in map){ const st=map[k]; if(st.count) st.acc=st.sum/st.count; }
  return map;
}

async function router(){
  const raw=location.hash.replace(/^#\//,'')||'dashboard';
  const path=raw.split('?')[0];
  const parts=path.split('/');
  const name=parts[0];
  const navs=document.querySelectorAll('nav a');
  navs.forEach(a=>a.classList.toggle('active',a.dataset.nav===name || (name==='student'&&a.dataset.nav==='students')));
  if(name==='student'&&parts[1]) return routes.student(parts[1]);
  (routes[name]||routes.dashboard)();
}
window.addEventListener('hashchange',router);

/* =========================================================
   视图：总览
========================================================= */
async function renderDashboard(){
  const [students,poems,records]=await Promise.all([getStudents(),getPoems(),getRecords()]);
  const stats=studentStats(records,students);
  const arr=students.map(s=>stats[s.id]).filter(s=>s.acc!=null);
  const avg=arr.length?arr.reduce((a,b)=>a+b.acc,0)/arr.length:null;
  const weak=arr.filter(s=>s.acc<0.7).length;
  // 易错句
  const lineAgg={};
  for(const r of records){ for(const lr of r.lineResults||[]){ if(lr.accuracy==null)continue; const k=lr.line; if(!lineAgg[k])lineAgg[k]={n:0,sum:0}; lineAgg[k].n++; lineAgg[k].sum+=lr.accuracy; } }
  const hardLines=Object.entries(lineAgg).map(([k,v])=>({line:k,acc:v.sum/v.n})).sort((a,b)=>a.acc-b.acc).slice(0,5);
  const recent=[...records].sort((a,b)=>b.date-a.date).slice(0,8);
  const pname=async id=>{const s=await getStudent(id);return s?s.name:'?'};
  const ptname=async id=>{const p=await getPoem(id);return p?p.title:'?'};

  view.innerHTML=`
    <div class="grid g-4">
      <div class="stat"><div class="num b">${students.length}</div><div class="lbl">学生总数</div></div>
      <div class="stat"><div class="num">${poems.length}</div><div class="lbl">古诗库篇目</div></div>
      <div class="stat"><div class="num ${avg==null?'':(avg>=0.8?'g':'y')}">${avg==null?'—':pct(avg)+'%'}</div><div class="lbl">全班平均正确率</div></div>
      <div class="stat"><div class="num ${weak?'r':'g'}">${weak}</div><div class="lbl">待关注学生(&lt;70%)</div></div>
    </div>

    <div class="grid g-2">
      <div class="card">
        <h2>易错诗句 TOP5</h2>
        ${hardLines.length?`<table><thead><tr><th>诗句</th><th>平均正确率</th></tr></thead><tbody>
          ${hardLines.map(h=>`<tr><td>${esc(h.line)}</td><td><span class="tag ${h.acc>=0.7?'g':(h.acc>=0.5?'y':'r')}">${pct(h.acc)}%</span></td></tr>`).join('')}
        </tbody></table>`:'<div class="empty">暂无朗读记录</div>'}
      </div>
      <div class="card">
        <h2>最近朗读记录</h2>
        ${recent.length?'<div id="recentList"></div>':'<div class="empty">暂无记录，去「读诗」页开始吧</div>'}
      </div>
    </div>`;

  if(recent.length){
    const box=document.getElementById('recentList');
    const rows=await Promise.all(recent.map(async r=>{
      const sn=await pname(r.studentId), tn=await ptname(r.poemId);
      return `<tr><td>${esc(sn)}</td><td>${esc(tn)}</td><td><span class="tag ${(r.overallAccuracy||0)>=0.8?'g':((r.overallAccuracy||0)>=0.6?'y':'r')}">${pct(r.overallAccuracy)}%</span></td><td class="muted">${r.mode||'朗读'}</td><td class="muted">${new Date(r.date).toLocaleDateString()}</td></tr>`;
    }));
    box.innerHTML=`<table><thead><tr><th>学生</th><th>诗</th><th>正确率</th><th>模式</th><th>日期</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
  }
}

function renderStudentRows(students,stats){

    <table>
      <thead><tr><th>姓名</th><th>班级</th><th>朗读次数</th><th>平均正确率</th><th></th></tr></thead>
      <tbody>
      ${list.map(s=>{
        const st=stats[s.id];
        return `<tr>
          <td>${esc(s.name)}</td><td class="muted">${esc(s.className)}</td>
          <td>${st.count}</td>
          <td>${st.acc==null?'<span class="muted">—</span>':`<span class="tag ${st.acc>=0.8?'g':(st.acc>=0.6?'y':'r')}">${pct(st.acc)}%</span>`}</td>
          <td><a class="link" href="#/student/${s.id}">查看档案 →</a></td>

async function renderStudent(id){
  const [s,records,poems]=await Promise.all([getStudent(id),getRecords(),getPoems()]);
  if(!s){view.innerHTML='<div class="empty">学生不存在</div>';return}
  const myRecs=records.filter(r=>r.studentId===id).sort((a,b)=>a.date-b.date);
  const poemMap={}; poems.forEach(p=>poemMap[p.id]=p);

  // 各诗正确率
  const poemAgg={};
  for(const r of myRecs){ if(r.overallAccuracy==null)continue; if(!poemAgg[r.poemId])poemAgg[r.poemId]={n:0,sum:0}; poemAgg[r.poemId].n++; poemAgg[r.poemId].sum+=r.overallAccuracy; }
  const poemList=Object.entries(poemAgg).map(([pid,v])=>({title:poemMap[pid]?poemMap[pid].title:pid,acc:v.sum/v.n})).sort((a,b)=>a.acc-b.acc);

  // 易错句（该生所有记录中正确率最低的句）
  const lineAgg={};
  for(const r of myRecs){ for(const lr of r.lineResults||[]){ if(lr.accuracy==null)continue; const k=lr.line; if(!lineAgg[k])lineAgg[k]={n:0,sum:0}; lineAgg[k].n++; lineAgg[k].sum+=lr.accuracy; } }
  const hardLines=Object.entries(lineAgg).map(([k,v])=>({line:k,acc:v.sum/v.n})).sort((a,b)=>a.acc-b.acc).slice(0,6);

  const avg=myRecs.length?myRecs.reduce((a,b)=>a+(b.overallAccuracy||0),0)/myRecs.length:null;

  view.innerHTML=`
    <div class="card">
      <div class="toolbar"><a class="link" href="#/students">← 返回</a><h2 style="margin:0;flex:1">${esc(s.name)} <span class="muted" style="font-size:14px;font-weight:400">${esc(s.className)}</span></h2>
      <span class="tag ${avg==null?'':(avg>=0.8?'g':(avg>=0.6?'y':'r'))}">平均 ${avg==null?'—':pct(avg)+'%'}</span>
      </div>
      <div class="muted">朗读次数：${myRecs.length}　|　涉及古诗：${Object.keys(poemAgg).length} 首</div>
    </div>

    <div class="grid g-2">
      <div class="card">
        <h3>各诗正确率（从低到高）</h3>
        ${poemList.length?poemList.map(p=>`<div style="margin-bottom:9px">
          <div class="row" style="justify-content:space-between"><span style="font-size:14px">${esc(p.title)}</span><span class="muted">${pct(p.acc)}%</span></div>
          <div class="bar"><i style="width:${pct(p.acc)}%;background:${colorFor(p.acc)}"></i></div>
        </div>`).join(''):'<div class="empty">暂无朗读记录</div>'}
      </div>
      <div class="card">
        <h3>易错诗句 TOP</h3>
        ${hardLines.length?`<table><thead><tr><th>诗句</th><th>正确率</th></tr></thead><tbody>
          ${hardLines.map(h=>`<tr><td>${esc(h.line)}</td><td><span class="tag ${h.acc>=0.7?'g':(h.acc>=0.5?'y':'r')}">${pct(h.acc)}%</span></td></tr>`).join('')}
        </tbody></table>`:'<div class="empty">暂无数据</div>'}
      </div>
    </div>

    <div class="card">
      <h3>朗读记录时间线</h3>
      ${myRecs.length?`<table><thead><tr><th>日期</th><th>古诗</th><th>模式</th><th>正确率</th></tr></thead><tbody>
        ${[...myRecs].reverse().map(r=>`<tr><td class="muted">${new Date(r.date).toLocaleString()}</td><td>${esc(poemMap[r.poemId]?poemMap[r.poemId].title:'?')}</td><td>${r.mode||'朗读'}</td><td><span class="tag ${(r.overallAccuracy||0)>=0.8?'g':((r.overallAccuracy||0)>=0.6?'y':'r')}">${pct(r.overallAccuracy)}%</span></td></tr>`).join('')}
      </tbody></table>`:'<div class="empty">该生还没有朗读记录</div>'}
    </div>`;
}

function startRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('当前浏览器不支持语音识别，请用 Chrome/Edge');return}
  recognition=new SR();
  recognition.lang='zh-CN';
  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal){ readState.transcript+=r[0].transcript; }
      else { interim+=r[0].transcript; }
    }
    readState.interim=interim;
    document.getElementById('liveBox').innerHTML=(readState.recording?'<span class="rec-dot"></span>':'')+esc(readState.transcript)+'<span style="color:#94a3b8">'+esc(interim)+'</span>';
  };
  recognition.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){toast('麦克风权限被拒绝，请在浏览器地址栏允许麦克风');stopRecognition()}
    else if(e.error==='no-speech'){/* 静音，忽略 */}
    else {toast('识别错误：'+e.error)}
  };
  recognition.onend=()=>{
    readState.recording=false; updateRecUI();
    if(readState.shouldFinalize){ readState.shouldFinalize=false; finalizeResult(); }
  };
  recognition.start();
  readState.recording=true;
  readState.shouldFinalize=false;
  readState.transcript=''; readState.interim='';
  readState.result=null;
  document.getElementById('resultCard').style.display='none';
  document.getElementById('liveBox').innerHTML='<span class="rec-dot"></span>正在聆听…';
  startTimer();
  updateRecUI();
}
function stopRecognition(){
  readState.shouldFinalize=true;
  if(recognition){ try{recognition.stop()}catch(e){} }
  readState.recording=false; stopTimer(); updateRecUI();
}
let timerH=null, timerS=0;
function startTimer(){timerS=0;document.getElementById('recTimer').textContent='00:00';timerH=setInterval(()=>{timerS++;const m=String(Math.floor(timerS/60)).padStart(2,'0'),s=String(timerS%60).padStart(2,'0');document.getElementById('recTimer').textContent=m+':'+s},1000)}
function stopTimer(){clearInterval(timerH);timerH=null}
function updateRecUI(){
  const s=document.getElementById('btnStart'), st=document.getElementById('btnStop');
  if(s)s.disabled=readState.recording;
  if(st)st.disabled=!readState.recording;
}

/* 打分：整首对齐 */
async function finalizeResult(){
  const poem=await getPoem(readState.poemId);
  if(!poem){toast('未找到诗');return}
  const target=poem.lines.join('');
  const recognized=(readState.transcript||'').replace(/[^\u4e00-\u9fa5]/g,'');
  if(!recognized){toast('没有识别到任何文字，请重试');return}
  const align=alignChars(target,recognized);
  // 按句分组
  let offset=0;
  const lineResults=[];
  for(const line of poem.lines){
    const chars=[];
    for(let k=0;k<line.length;k++){
      const a=align[offset+k];
      chars.push({c:line[k], ok:a?a.ok:false, missing:!a});
    }
    const okCount=chars.filter(c=>c.ok).length;
    lineResults.push({line, chars, accuracy:chars.length?okCount/chars.length:0});
    offset+=line.length;
  }
  const totalTarget=target.length;
  const totalOk=align.filter(a=>a&&a.ok).length;
  readState.result={lineResults, overallAccuracy:totalTarget?totalOk/totalTarget:0, recognized};
  renderResult();
}
function alignChars(a,b){
  const n=a.length,m=b.length;
  const dp=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=0;i<=n;i++)dp[i][0]=i;
  for(let j=0;j<=m;j++)dp[0][j]=j;
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){
    const c=a[i-1]===b[j-1]?0:1;
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+c);
  }
  const res=new Array(n).fill(null);
  let i=n,j=m;
  while(i>0&&j>0){
    const c=a[i-1]===b[j-1]?0:1;
    if(dp[i][j]===dp[i-1][j-1]+c){res[i-1]={r:b[j-1],ok:c===0};i--;j--}
    else if(dp[i][j]===dp[i-1][j]+1){res[i-1]=null;i--}
    else{j--}
  }
  return res;
}
function renderResult(){
  const r=readState.result; if(!r)return;
  document.getElementById('resultCard').style.display='';
  const tag=document.getElementById('overallTag');
  const acc=r.overallAccuracy;
  tag.textContent='整首正确率 '+pct(acc)+'%';
  tag.className='tag '+(acc>=0.8?'g':(acc>=0.6?'y':'r'));
  const box=document.getElementById('resultLines');
  box.innerHTML=r.lineResults.map((lr,li)=>`
    <div class="line-res">
      <div style="flex:1">${lr.chars.map((ch,ci)=>`<span class="char ${ch.missing?'miss':(ch.ok?'ok':'bad')}" data-li="${li}" data-ci="${ci}">${esc(ch.c)}</span>`).join('')}</div>
      <span class="acc" style="background:${colorFor(lr.accuracy)}22;color:${colorFor(lr.accuracy)}">${pct(lr.accuracy)}%</span>
    </div>`).join('');
  // 点击修正
  box.querySelectorAll('.char').forEach(el=>{
    el.onclick=()=>{
      const li=+el.dataset.li, ci=+el.dataset.ci;
      const ch=readState.result.lineResults[li].chars[ci];
      if(ch.missing){ch.missing=false;ch.ok=true;}else if(ch.ok){ch.ok=false;}else{ch.ok=true;ch.missing=false;}
      recalcAccuracy(); renderResult();
    };
  });
}
function recalcAccuracy(){
  const r=readState.result;
  let totalOk=0,totalN=0;
  for(const lr of r.lineResults){
    const ok=lr.chars.filter(c=>c.ok&&!c.missing).length;
    lr.accuracy=lr.chars.length?ok/lr.chars.length:0;
    totalOk+=ok; totalN+=lr.chars.length;
  }
  r.overallAccuracy=totalN?totalOk/totalN:0;
}
async function saveRecord(){
  const r=readState.result; if(!r){toast('请先完成一次朗读');return}
  const record={id:uid(),studentId:readState.studentId,poemId:readState.poemId,date:Date.now(),mode:readState.mode,overallAccuracy:r.overallAccuracy,lineResults:r.lineResults.map(lr=>({line:lr.line,accuracy:lr.accuracy})),recognized:r.recognized};
  await idbPut('records',record);
  toast('已保存记录 ✓'); readState.result=null; readState.transcript=''; readState.interim='';
  document.getElementById('resultCard').style.display='none';
  document.getElementById('liveBox').textContent='记录已保存。可继续朗读或切换古诗。';
}

function initChart(){
  const el=document.getElementById('chart');
  if(el && !el._chart) el._chart=echarts.init(el);
  return el && el._chart;
}
function setChart(option){
  const c=initChart(); if(!c)return;
  c.clear(); c.setOption(option); c.resize();
}
window.addEventListener('resize',()=>{const el=document.getElementById('chart');if(el&&el._chart)el._chart.resize()});

function renderHeatmap(records,students,poems,grade){
  const chart=initChart();
  const pool=grade==='全部'?poems:poems.filter(p=>p.grade===grade);
  const stuNames=students.map(s=>s.name);
  const agg={}; // studentId -> {poemId -> {n,sum}}
  for(const r of records){
    if(r.overallAccuracy==null) continue;
    if(!pool.some(p=>p.id===r.poemId)) continue;
    if(!agg[r.studentId]) agg[r.studentId]={};
    if(!agg[r.studentId][r.poemId]) agg[r.studentId][r.poemId]={n:0,sum:0};
    agg[r.studentId][r.poemId].n++; agg[r.studentId][r.poemId].sum+=r.overallAccuracy;
  }
  const data=[];
  for(let si=0;si<students.length;si++){
    const sid=students[si].id;
    for(let pi=0;pi<pool.length;pi++){
      const pid=pool[pi].id;
      const v=agg[sid]&&agg[sid][pid];
      data.push([pi,si,v?Math.round(v.sum/v.n*100):null]);
    }
  }
  const option={
    tooltip:{formatter:p=>{const pi=p.value[0],si=p.value[1],v=p.value[2];return `${stuNames[si]} · 《${pool[pi].title}》<br/>平均正确率：${v==null?'—':v+'%'}`}},
    grid:{left:90,right:20,top:20,bottom:80},
    xAxis:{type:'category',data:pool.map(p=>p.title),axisLabel:{rotate:45,fontSize:10}},
    yAxis:{type:'category',data:stuNames,axisLabel:{fontSize:11}},
    visualMap:{min:0,max:100,calculable:true,orient:'horizontal',left:'center',bottom:0,text:['高','低'],inRange:{color:['#ef4444','#f59e0b','#22c55e']}},
    series:[{type:'heatmap',data,itemStyle:{borderColor:'#fff',borderWidth:1}}]
  };
  chart.clear(); chart.setOption(option); chart.resize();
}

function renderStudentRank(records,students){
  const stats=studentStats(records,students);
  const list=students.map(s=>stats[s.id]).filter(s=>s.acc!=null).sort((a,b)=>a.acc-b.acc);
  const chart=initChart();
  chart.clear();
  chart.setOption({
    tooltip:{trigger:'axis',axisPointer:{type:'shadow'},formatter:p=>`${p[0].name}<br/>平均正确率：${Math.round(p[0].value)}%`},
    grid:{left:90,right:30,top:10,bottom:60},
    xAxis:{type:'category',data:list.map(x=>x.name),axisLabel:{rotate:45,fontSize:10}},
    yAxis:{type:'value',max:100,axisLabel:{formatter:'{value}%'}},
    series:[{type:'bar',data:list.map(x=>({value:Math.round(x.acc*100),itemStyle:{color:colorFor(x.acc)}})),barMaxWidth:24}]
  });
  chart.resize();
  const weak=list.filter(s=>s.acc<0.7);
  document.getElementById('anaTable').innerHTML=`<div class="muted" style="margin-top:10px">${list.length?('正确率最低的学生：'+list.slice(0,5).map(s=>s.name+'('+pct(s.acc)+'%)').join('、')):'暂无数据'}</div>
    ${weak.length?`<div class="hint" style="margin-top:10px">待关注（&lt;70%）：${weak.map(s=>s.name).join('、')}</div>`:''}`;
}

function renderPoemRank(records,poems){
  const agg={};
  for(const r of records){ if(r.overallAccuracy==null)continue; if(!agg[r.poemId])agg[r.poemId]={n:0,sum:0}; agg[r.poemId].n++; agg[r.poemId].sum+=r.overallAccuracy; }
  const list=poems.map(p=>({title:p.title,acc:agg[p.id]?(agg[p.id].sum/agg[p.id].n):null,n:agg[p.id]?agg[p.id].n:0})).filter(x=>x.acc!=null).sort((a,b)=>a.acc-b.acc);
  const chart=initChart();
  chart.clear();
  chart.setOption({
    tooltip:{trigger:'axis',axisPointer:{type:'shadow'},formatter:p=>`${p[0].name}<br/>平均正确率：${Math.round(p[0].value)}%`},
    grid:{left:90,right:30,top:10,bottom:60},
    xAxis:{type:'category',data:list.map(x=>x.title),axisLabel:{rotate:45,fontSize:10}},
    yAxis:{type:'value',max:100,axisLabel:{formatter:'{value}%'}},
    series:[{type:'bar',data:list.map(x=>({value:Math.round(x.acc*100),itemStyle:{color:colorFor(x.acc)}})),barMaxWidth:24}]
  });
  chart.resize();
  document.getElementById('anaTable').innerHTML=`<div class="muted" style="margin-top:10px">${list.length?('整体最易错的诗：'+list.slice(0,5).map(x=>x.title+'('+pct(x.acc)+'%)').join('、')):'暂无数据'}</div>`;
}

/* =========================================================
   导出 / 导入
========================================================= */
document.getElementById('btnExport').onclick=async()=>{
  const [students,poems,records]=await Promise.all([getStudents(),getPoems(),getRecords()]);
  const data={students,poems,records,exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='古诗朗读评测数据_'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('已导出 JSON 数据文件');
};
document.getElementById('btnImport').onclick=()=>{
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=async e=>{
    const f=e.target.files[0]; if(!f)return;
    const text=await f.text();
    try{
      const data=JSON.parse(text);
      if(!data.students||!data.records){toast('文件格式不正确');return}
      showModal(`<h3>导入数据</h3><p class="muted">将导入 ${data.students.length} 名学生、${data.poems?data.poems.length:0} 首诗、${data.records.length} 条记录。<br><br>请选择导入方式：</p>
        <div class="row"><button class="btn ghost" id="impMerge">合并（保留现有）</button><button class="btn danger" id="impReplace">覆盖（清空现有）</button><button class="btn ghost" onclick="closeModal()">取消</button></div>`);
      document.getElementById('impMerge').onclick=async()=>{await doImport(data,false)};
      document.getElementById('impReplace').onclick=async()=>{await doImport(data,true)};
    }catch(err){toast('解析失败：'+err.message)}
  };
  inp.click();
};
async function doImport(data,replace){
  if(replace){
    await new Promise(res=>{const q=tx('students','readwrite').clear();q.onsuccess=()=>res()});
    await new Promise(res=>{const q=tx('poems','readwrite').clear();q.onsuccess=()=>res()});
    await new Promise(res=>{const q=tx('records','readwrite').clear();q.onsuccess=()=>res()});
  }
  for(const s of data.students){ await idbPut('students',s) }
  if(data.poems) for(const p of data.poems){ await idbPut('poems',p) }
  for(const r of data.records){ await idbPut('records',r) }
  await idbPut('meta',{k:'seeded',v:Date.now()});
  closeModal(); toast('导入完成'); router();
}

/* =========================================================
   启动
========================================================= */
(async function(){
  await init();
  await router();
})();
</script>
